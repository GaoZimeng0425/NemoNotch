name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly Monday ~06:27 UTC (off-round minute to avoid fleet spikes)
    - cron: '27 6 * * 1'

# Least-privilege token: CodeQL needs security-events:write to upload SARIF,
# actions:read for run context, contents:read for checkout. Nothing else.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (swift, actions)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # The project targets macOS 26.2 / Swift 6 and uses Xcode 16+ auto-sync
      # root groups — older Xcode can't read the .xcodeproj, which is exactly
      # why CodeQL's default-setup autobuild reported [no-swift-target].
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # One job, two languages: `actions` (YAML) needs no build and is extracted
      # at init; `swift` needs a real compile, so we build manually below.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift, actions

      # Manual Swift build — mirrors release.yml's known-good invocation
      # (archive -> build, dropped -archivePath). The build tracer armed by
      # init intercepts xcodebuild and populates the swift database; the
      # actions database is already complete from init.
      - name: Build for CodeQL
        run: |
          xcodebuild build \
            -project NemoNotch.xcodeproj \
            -scheme NemoNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=26.2 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
