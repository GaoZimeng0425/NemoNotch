name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege token: only the release step (softprops/action-gh-release)
# needs write access to create the release and upload DMG assets; checkout
# only reads. No PR/issues/packages/deployments are touched.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build archive (${{ matrix.arch }})
        run: |
          # Version comes from the pushed tag (e.g. v0.5.0 -> 0.5.0); the build
          # number is the monotonic Actions run number. pbxproj's MARKETING_VERSION
          # is only a local-dev placeholder — the release always uses the tag.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION (build ${{ github.run_number }})"
          xcodebuild archive \
            -project NemoNotch.xcodeproj \
            -scheme NemoNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -archivePath build/NemoNotch.xcarchive \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=26.2 \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Export .app
        run: |
          xcodebuild -exportArchive \
            -archivePath build/NemoNotch.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - build/export/NemoNotch.app

      - name: Create DMG (${{ matrix.arch }})
        run: |
          mkdir -p build/dmg_staging
          cp -R build/export/NemoNotch.app build/dmg_staging/
          ln -s /Applications build/dmg_staging/Applications
          hdiutil create -volname NemoNotch \
            -srcfolder build/dmg_staging \
            -ov -format UDZO \
            build/NemoNotch-${{ matrix.arch }}.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/NemoNotch-${{ matrix.arch }}.dmg
          generate_release_notes: true
